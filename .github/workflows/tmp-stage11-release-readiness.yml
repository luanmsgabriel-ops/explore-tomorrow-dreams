name: Temporary Stage 11 release readiness validation

on:
  push:
    branches:
      - chore/stage11-release-readiness
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Smoke helper tests
        run: node --test scripts/stage11-smoke.test.mjs

      - name: Smoke syntax check
        run: node --check scripts/stage11-smoke.mjs

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check origin/main...HEAD
