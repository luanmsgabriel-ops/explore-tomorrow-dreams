name: Travel Match Real Card Validation
on:
  pull_request:
    paths:
      - 'src/pages/MyTomorrowWelcome.tsx'
      - 'src/pages/MyTomorrowPreferences.tsx'
      - '.github/workflows/travel-match-real-card-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scoped ESLint
        run: npx eslint src/pages/MyTomorrowWelcome.tsx src/pages/MyTomorrowPreferences.tsx
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
