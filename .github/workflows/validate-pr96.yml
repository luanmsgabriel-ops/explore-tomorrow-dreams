name: Validate PR 96

on:
  push:
    branches:
      - fix/trip-composer-viator-strict-tours

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deno check window
        run: deno check supabase/functions/trip-composer-window/index.ts
      - name: Deno tests Trip Composer
        run: deno test supabase/functions/_shared/trip-composer-window.test.ts supabase/functions/_shared/trip-composer-viator.test.ts
      - name: Assert strict Viator policy
        run: |
          grep -q 'strictViator ? \[viatorPlaces\]' supabase/functions/trip-composer-window/index.ts
          grep -q 'viator_unavailable' supabase/functions/trip-composer-window/index.ts
          grep -q 'if (!strictViator)' supabase/functions/trip-composer-window/index.ts
      - name: Install frontend dependencies
        run: npm install --no-package-lock
      - name: Scoped ESLint
        run: npx eslint src/lib/tripComposerRealtime.ts src/lib/tripComposerRealtime.test.ts
      - name: Frontend focused tests
        run: npx vitest run src/lib/tripComposerRealtime.test.ts
      - name: Build
        run: npm run build
