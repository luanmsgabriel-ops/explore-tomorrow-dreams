name: My Tomorrow Phase 4 Validation

on:
  pull_request:
    paths:
      - 'src/pages/MyTomorrowRadar*.tsx'
      - 'src/lib/myTomorrowRadars.ts'
      - 'src/lib/myTomorrowRadars.test.ts'
      - 'src/pages/MyTomorrowDashboard.tsx'
      - 'src/components/opportunities/catalogFilterState.ts'
      - 'src/components/opportunities/SaveCatalogRadarButton.tsx'
      - 'src/App.tsx'
      - 'supabase/functions/my-tomorrow-radars/**'
      - 'supabase/migrations/*my_tomorrow_radar_crud.sql'
      - '.github/workflows/my-tomorrow-phase4-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused tests
        run: npx vitest run src/lib/myTomorrowRadars.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scoped ESLint
        run: npx eslint src/pages/MyTomorrowRadars.tsx src/pages/MyTomorrowRadarDetail.tsx src/pages/MyTomorrowDashboard.tsx src/lib/myTomorrowRadars.ts src/lib/myTomorrowRadars.test.ts src/components/opportunities/catalogFilterState.ts src/components/opportunities/SaveCatalogRadarButton.tsx src/App.tsx
      - name: Production build
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check
        run: deno check supabase/functions/my-tomorrow-radars/index.ts
      - name: Diff whitespace check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
