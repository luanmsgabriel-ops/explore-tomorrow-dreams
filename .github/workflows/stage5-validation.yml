name: Stage 5 Validation

on:
  push:
    branches: [stage-5-smart-calendar]
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/components/opportunities/OpportunityHeader.tsx'
      - 'src/lib/opportunityCalendar.ts'
      - 'src/lib/opportunityCalendar.test.ts'
      - 'src/pages/OpportunitiesCalendar.tsx'
      - '.github/workflows/stage5-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: Lint Stage 5 scope
        run: bunx eslint src/App.tsx src/components/opportunities/OpportunityHeader.tsx src/lib/opportunityCalendar.ts src/lib/opportunityCalendar.test.ts src/pages/OpportunitiesCalendar.tsx

      - name: Production build
        run: bun run build

      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: stage5-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
