name: Compare mobile persistence validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compare tests
        run: bun run test -- src/pages/opportunityCompare.test.tsx
      - name: TypeScript
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: ESLint focused scope
        run: bunx eslint src/lib/opportunityComparison.ts src/pages/OpportunityCompare.tsx src/pages/opportunityCompare.test.tsx
      - name: Build
        run: bun run build
