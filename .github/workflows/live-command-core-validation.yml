name: Tomorrow Live command core validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tomorrow Live tests
        run: bun run test -- src/pages/opportunitiesLive.test.tsx src/components/opportunities/opportunities.test.tsx
      - name: TypeScript
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: ESLint focused scope
        run: bunx eslint src/components/opportunities/live/LiveParticleGlobe.tsx
      - name: Build
        run: bun run build
