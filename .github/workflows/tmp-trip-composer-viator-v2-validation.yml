name: Temporary Trip Composer Viator V2 Validation

on:
  push:
    branches:
      - feat/trip-composer-viator-discovery-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check Viator function
        run: deno check supabase/functions/trip-composer-viator/index.ts
      - name: Deno check window function
        run: deno check supabase/functions/trip-composer-window/index.ts
      - name: Deno focused tests
        run: deno test supabase/functions/_shared/trip-composer-viator.test.ts supabase/functions/_shared/trip-composer-window.test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install without rewriting lockfile
        run: npm install --no-package-lock
      - name: Frontend focused tests
        run: npx vitest run src/lib/tripComposerApi.test.ts src/lib/tripComposerRealtime.test.ts
      - name: ESLint changed frontend scope
        run: npx eslint src/lib/tripComposerApi.ts src/lib/tripComposerRealtime.ts src/hooks/useTripComposerRuntime.ts
      - name: Build
        run: npm run build
