name: My Tomorrow Phase 3 Validation

on:
  pull_request:
    paths:
      - 'src/pages/MyTomorrowProfile.tsx'
      - 'src/pages/MyTomorrowPreferences.tsx'
      - 'src/pages/MyTomorrowDashboard.tsx'
      - 'src/lib/myTomorrowProfile.ts'
      - 'src/lib/myTomorrowProfile.test.ts'
      - 'src/App.tsx'
      - 'supabase/functions/my-tomorrow-profile/**'
      - 'supabase/migrations/*my_tomorrow_travel_profile.sql'
      - '.github/workflows/my-tomorrow-phase3-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused tests
        run: npx vitest run src/lib/myTomorrowProfile.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scoped ESLint
        run: npx eslint src/pages/MyTomorrowProfile.tsx src/pages/MyTomorrowPreferences.tsx src/pages/MyTomorrowDashboard.tsx src/lib/myTomorrowProfile.ts src/lib/myTomorrowProfile.test.ts src/App.tsx
      - name: Production build
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check
        run: deno check supabase/functions/my-tomorrow-profile/index.ts
      - name: Diff whitespace check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
