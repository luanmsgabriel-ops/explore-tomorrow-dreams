name: Stage 8 structured handoff CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/hooks/useRealtimeVoice.ts"
      - "src/hooks/useRealtimeVoice.test.tsx"
      - "src/lib/offerHandoff.ts"
      - "src/lib/offerHandoff.test.ts"
      - "src/pages/OpportunitiesLive.tsx"
      - "src/pages/opportunitiesLiveHandoff.test.tsx"
      - "docs/TOMORROW_LIVE_MASTER_PLAN.md"
      - "docs/TOMORROW_LIVE_STAGE_8_STRUCTURED_HANDOFF.md"
      - ".github/workflows/stage-8-structured-handoff-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Focused tests
        run: bunx vitest run src/lib/offerHandoff.test.ts src/lib/realtimeVoice.test.ts src/hooks/useRealtimeVoice.test.tsx src/pages/opportunitiesLiveHandoff.test.tsx src/pages/opportunitiesLive.test.tsx
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: ESLint scoped
        run: bunx eslint src/hooks/useRealtimeVoice.ts src/hooks/useRealtimeVoice.test.tsx src/lib/offerHandoff.ts src/lib/offerHandoff.test.ts src/pages/OpportunitiesLive.tsx src/pages/opportunitiesLiveHandoff.test.tsx
      - name: Production build
        run: bun run build
