name: My Tomorrow Phase 6A Validation

on:
  pull_request:
    paths:
      - 'src/pages/MyTomorrowNotifications.tsx'
      - 'src/pages/MyTomorrowDashboard.tsx'
      - 'src/lib/myTomorrowAlerts.ts'
      - 'src/lib/myTomorrowAlerts.test.ts'
      - 'src/App.tsx'
      - 'supabase/functions/my-tomorrow-matching/**'
      - 'supabase/migrations/*my_tomorrow_radar_alerts.sql'
      - '.github/workflows/my-tomorrow-phase6a-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused frontend tests
        run: npx vitest run src/lib/myTomorrowAlerts.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scoped ESLint
        run: npx eslint src/pages/MyTomorrowNotifications.tsx src/pages/MyTomorrowDashboard.tsx src/lib/myTomorrowAlerts.ts src/lib/myTomorrowAlerts.test.ts src/App.tsx
      - name: Production build
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Matcher regression tests
        run: deno test supabase/functions/my-tomorrow-matching/matcher.test.ts
      - name: Deno check
        run: deno check supabase/functions/my-tomorrow-matching/index.ts
      - name: Diff whitespace check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
