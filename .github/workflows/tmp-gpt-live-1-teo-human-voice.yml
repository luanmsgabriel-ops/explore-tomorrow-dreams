name: tmp-gpt-live-1-teo-human-voice

on:
  push:
    branches:
      - feat/gpt-live-1-teo-human-voice-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install
        run: bun install --frozen-lockfile
      - name: Focused Deno test
        run: deno test supabase/functions/tomorrow-live-gpt-live-call/index_test.ts
      - name: TypeScript
        run: bun x tsc --noEmit
      - name: ESLint scope
        run: bun x eslint supabase/functions/tomorrow-live-gpt-live-call/core.ts supabase/functions/tomorrow-live-gpt-live-call/index_test.ts
      - name: Build
        run: bun run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
