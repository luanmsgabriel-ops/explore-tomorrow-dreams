name: Temporary sync Unicode quality gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/travel-offers-sync/**'
      - '.github/workflows/temp-sync-unicode-quality.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check
        run: deno check supabase/functions/travel-offers-sync/index.ts supabase/functions/travel-offers-sync/sanitize.ts
      - name: Deno tests
        run: deno test supabase/functions/travel-offers-sync/sanitize_test.ts
      - name: Diff check
        run: git diff --check origin/main...HEAD -- supabase/functions/travel-offers-sync/index.ts supabase/functions/travel-offers-sync/sanitize.ts supabase/functions/travel-offers-sync/sanitize_test.ts
