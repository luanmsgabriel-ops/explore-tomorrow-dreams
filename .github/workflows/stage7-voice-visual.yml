name: Stage 7 voice and visual validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/components/opportunities/live/LiveParticleGlobe.test.ts src/components/opportunities/live/liveGlobeEffects.test.ts src/components/opportunities/live/LiveWaveBackdrop.test.tsx src/lib/realtimeVoice.test.ts
      - run: bunx tsc --project tsconfig.stage7-ci.json
      - run: bunx eslint src/components/opportunities/live/LiveParticleGlobe.tsx src/components/opportunities/live/liveGlobeEffects.ts src/components/opportunities/live/liveVisualLevel.ts src/components/opportunities/live/LiveParticleGlobe.test.ts src/components/opportunities/live/liveGlobeEffects.test.ts supabase/functions/tomorrow-live-realtime-session/core.ts supabase/functions/tomorrow-live-realtime-session/index_test.ts
      - run: bun run build
      - uses: denoland/setup-deno@v2
      - run: deno test --allow-env --allow-net supabase/functions/tomorrow-live-realtime-session/index_test.ts
