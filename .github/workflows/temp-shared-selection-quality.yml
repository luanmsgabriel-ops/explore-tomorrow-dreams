name: Temporary shared selection quality gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/components/opportunities/OpportunitySelectionShareDialog.tsx'
      - 'src/lib/opportunitySelection*'
      - 'src/pages/OpportunitiesCatalog.tsx'
      - 'src/pages/OpportunitySelection.tsx'
      - 'supabase/config.toml'
      - 'supabase/functions/travel-offer-selection/**'
      - 'supabase/migrations/20260826010000_travel_offer_selections.sql'
      - '.github/workflows/temp-shared-selection-quality.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Focused Vitest
        run: npx vitest run src/lib/opportunitySelection.test.ts src/pages/opportunitiesCatalog.test.tsx
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint scope
        run: npx eslint src/App.tsx src/components/opportunities/OpportunitySelectionShareDialog.tsx src/lib/opportunitySelection.ts src/lib/opportunitySelection.test.ts src/pages/OpportunitiesCatalog.tsx src/pages/OpportunitySelection.tsx
      - name: Deno check
        run: deno check supabase/functions/travel-offer-selection/core.ts supabase/functions/travel-offer-selection/index.ts
      - name: Deno tests
        run: deno test supabase/functions/travel-offer-selection/core_test.ts
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
