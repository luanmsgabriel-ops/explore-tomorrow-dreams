name: ORION APK Build

on:
  push:
    branches: ['build/orion-auto-v0-1']
    paths:
      - '.orion-build/**'
      - '.github/workflows/orion-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ORION source
        run: |
          mkdir -p /tmp/orion-build
          base64 -d .orion-build/ORION-v0.1-project.zip.b64 > /tmp/orion-project.zip
          unzip -q /tmp/orion-project.zip -d /tmp/orion-build
          test -f /tmp/orion-build/orion-android/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle -p /tmp/orion-build/orion-android --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle -p /tmp/orion-build/orion-android --no-daemon lintDebug

      - name: Build installable debug APK
        run: gradle -p /tmp/orion-build/orion-android --no-daemon assembleDebug

      - name: Verify APK and package evidence
        run: |
          mkdir -p dist
          APK=/tmp/orion-build/orion-android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" dist/ORION-v0.1.apk
          sha256sum dist/ORION-v0.1.apk | tee dist/SHA256SUMS.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ORION-v0.1.apk | tee dist/apksigner.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging dist/ORION-v0.1.apk | tee dist/badging.txt
          cp -r /tmp/orion-build/orion-android/app/build/reports/tests/testDebugUnitTest dist/unit-tests
          cp /tmp/orion-build/orion-android/app/build/reports/lint-results-debug.html dist/lint-results.html

      - name: Upload APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: ORION-v0.1-android
          path: dist/
          if-no-files-found: error
          retention-days: 14
