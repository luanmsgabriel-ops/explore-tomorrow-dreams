name: Progressive Tomorrow Profile Validation
on:
  pull_request:
    paths:
      - 'src/lib/progressiveTravelProfile.ts'
      - 'src/lib/myTomorrowProfile.ts'
      - 'src/pages/MyTomorrowWelcome.tsx'
      - 'src/pages/MyTomorrowProfileRefine.tsx'
      - 'src/pages/MyTomorrowDashboard.tsx'
      - 'src/App.tsx'
      - 'supabase/functions/my-tomorrow-profile/**'
      - 'supabase/migrations/20260912102000_progressive_traveler_profile.sql'
      - '.github/workflows/progressive-profile-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint src/lib/progressiveTravelProfile.ts src/lib/myTomorrowProfile.ts src/pages/MyTomorrowWelcome.tsx src/pages/MyTomorrowProfileRefine.tsx src/pages/MyTomorrowDashboard.tsx src/App.tsx
      - run: npm run build
      - run: npx deno check supabase/functions/my-tomorrow-profile/index.ts
      - run: git diff --check origin/${{ github.base_ref }}...HEAD
