name: Temporary Stage 9 curation validation

on:
  push:
    branches:
      - feat/stage-9-curation-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migration contract checks
        shell: bash
        run: |
          set -euo pipefail
          file="supabase/migrations/20260822163500_stage9_travel_offer_curation.sql"
          test -f "$file"
          grep -q "CREATE TABLE public.travel_offer_curation" "$file"
          grep -q "CREATE TABLE public.travel_offer_collections" "$file"
          grep -q "CREATE TABLE public.travel_offer_collection_items" "$file"
          grep -q "CREATE TABLE public.travel_offer_curation_audit" "$file"
          grep -q "ALTER TABLE public.travel_offer_curation ENABLE ROW LEVEL SECURITY" "$file"
          grep -q "profiles.role = 'admin'" "$file"
          grep -q "REFERENCES public.travel_offers(id)" "$file"
          if grep -Eq "ALTER TABLE public\.travel_offers|UPDATE public\.travel_offers|DELETE FROM public\.travel_offers|INSERT INTO public\.travel_offers" "$file"; then
            echo "Migration must not mutate the supplier-owned travel_offers table"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies despite historical lock drift
        run: npm install --package-lock=false --ignore-scripts

      - name: TypeScript excluding known historical error
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
          set -e
          cat /tmp/tsc.log
          unexpected=$(grep "error TS" /tmp/tsc.log | grep -v "src/components/admin/QuoteEditForm.tsx" || true)
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check origin/main...HEAD
