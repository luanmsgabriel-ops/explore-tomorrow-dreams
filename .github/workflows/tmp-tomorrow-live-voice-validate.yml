name: Temporary Tomorrow Live Voice Validation

on:
  push:
    branches:
      - fix/tomorrow-live-composer-voice-runtime

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install without changing lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Realtime edge tests
        run: deno test supabase/functions/tomorrow-live-realtime-session/index_test.ts
      - name: Focused Trip Composer frontend tests
        run: npx vitest run src/lib/tripComposerRealtime.test.ts src/components/opportunities/live/TripComposerPanel.test.tsx src/pages/opportunitiesLive.test.tsx
      - name: ESLint scope
        run: npx eslint src/hooks/useRealtimeVoice.ts src/lib/tripComposerRealtime.ts src/components/opportunities/live/TripComposerLiveSection.tsx src/pages/OpportunitiesLive.tsx
      - name: Build
        run: npm run build
