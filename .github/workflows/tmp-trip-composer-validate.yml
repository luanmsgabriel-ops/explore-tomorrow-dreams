name: Temporary Trip Composer Validation

on:
  push:
    branches:
      - fix/trip-composer-close-stage-1-6-gaps

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused tests
        run: npx vitest run src/lib/tripComposerRealtime.test.ts src/components/opportunities/live/TripComposerPanel.test.tsx src/pages/opportunitiesLive.test.tsx
      - name: TypeScript
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: ESLint scope
        run: npx eslint src/lib/tripComposerRealtime.ts src/hooks/useTripComposerRuntime.ts src/hooks/useRealtimeVoice.ts src/components/opportunities/live/TripComposerLiveSection.tsx src/pages/OpportunitiesLive.tsx
      - name: Build
        run: npm run build
