name: Temporary Trip Composer Validation

on:
  push:
    branches:
      - fix/trip-composer-close-stage-1-6-gaps

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install without changing lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Focused frontend tests
        run: npx vitest run src/lib/tripComposerRealtime.test.ts src/components/opportunities/live/TripComposerPanel.test.tsx src/pages/opportunitiesLive.test.tsx
      - name: Realtime edge contract tests
        run: deno test supabase/functions/tomorrow-live-realtime-session/index_test.ts
      - name: Prepare scoped TypeScript config
        run: |
          cat > tsconfig.trip-composer-validation.json <<'EOF'
          {
            "extends": "./tsconfig.app.json",
            "include": [
              "src/lib/tripComposerApi.ts",
              "src/lib/tripComposerRealtime.ts",
              "src/hooks/useTripComposerRuntime.ts",
              "src/hooks/useRealtimeVoice.ts",
              "src/components/opportunities/live/TripComposerPanel.tsx",
              "src/components/opportunities/live/TripComposerLiveSection.tsx",
              "src/pages/OpportunitiesLive.tsx"
            ]
          }
          EOF
      - name: TypeScript scope
        run: npx tsc -p tsconfig.trip-composer-validation.json --noEmit
      - name: ESLint scope
        run: npx eslint src/lib/tripComposerApi.ts src/lib/tripComposerRealtime.ts src/hooks/useTripComposerRuntime.ts src/hooks/useRealtimeVoice.ts src/components/opportunities/live/TripComposerPanel.tsx src/components/opportunities/live/TripComposerLiveSection.tsx src/pages/OpportunitiesLive.tsx
      - name: Build
        run: npm run build
