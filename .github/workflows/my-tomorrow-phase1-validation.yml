name: My Tomorrow Phase 1 Validation

on:
  pull_request:
    paths:
      - 'src/pages/Client*.tsx'
      - 'src/components/auth/**'
      - 'src/lib/tripComposerClaim.ts'
      - 'src/App.tsx'
      - 'supabase/functions/trip-composer-claim/**'
      - 'supabase/functions/create-user/**'
      - 'supabase/migrations/*my_tomorrow_identity_ownership.sql'
      - '.github/workflows/my-tomorrow-phase1-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused tests
        run: npx vitest run src/components/auth/ClientAuthGuard.test.tsx
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scoped ESLint
        run: npx eslint src/pages/ClientLogin.tsx src/pages/ClientSignUp.tsx src/pages/ClientForgotPassword.tsx src/pages/ClientResetPassword.tsx src/components/auth/ClientAuthGuard.tsx src/components/auth/ClientAuthGuard.test.tsx src/lib/tripComposerClaim.ts src/App.tsx
      - name: Production build
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno claim tests
        run: deno test supabase/functions/trip-composer-claim/claimUtils.test.ts
      - name: Deno check functions
        run: |
          deno check supabase/functions/trip-composer-claim/index.ts
          deno check supabase/functions/create-user/index.ts
      - name: Diff whitespace check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
