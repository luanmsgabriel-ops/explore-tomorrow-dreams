name: Temporary Live automatic handoff validation

on:
  push:
    branches:
      - fix/live-automatic-handoff-navigation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies despite historical lock drift
        run: npm install --package-lock=false --ignore-scripts
      - name: Focused Vitest
        run: npx vitest run src/components/opportunities/live/LiveOfferOverlay.test.tsx src/lib/offerHandoff.test.ts src/lib/realtimeVoice.test.ts
      - name: Scoped ESLint
        run: npx eslint src/components/opportunities/live/LiveOfferOverlay.tsx src/components/opportunities/live/LiveOfferOverlay.test.tsx
      - name: TypeScript excluding known historical error
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
          set -e
          cat /tmp/tsc.log
          unexpected=$(grep "error TS" /tmp/tsc.log | grep -v "src/components/admin/QuoteEditForm.tsx" || true)
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
