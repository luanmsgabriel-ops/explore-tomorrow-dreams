name: Temporary Tomorrow Live Unified WebRTC Validation

on:
  push:
    branches:
      - fix/tomorrow-live-unified-webrtc-start

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check new Realtime call function
        run: deno check supabase/functions/tomorrow-live-realtime-call/index.ts
      - name: Deno Realtime tests
        run: deno test supabase/functions/tomorrow-live-realtime-call/index_test.ts supabase/functions/tomorrow-live-realtime-session/index_test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install without rewriting lockfile
        run: npm install --no-package-lock
      - name: ESLint Realtime client
        run: npx eslint src/hooks/useRealtimeVoice.ts src/lib/realtimeVoice.ts
      - name: Focused Realtime tests
        run: npx vitest run src/lib/realtimeVoice.test.ts
      - name: Build
        run: npm run build
