name: Tomorrow Live Brazilian Portuguese voice

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/tomorrow-live-realtime-session/**"
      - "docs/TOMORROW_LIVE_MASTER_PLAN.md"
      - "docs/TOMORROW_LIVE_STAGE_7_VOICE_PT_BR.md"
      - ".github/workflows/tomorrow-live-voice-pt-br.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function tests
        run: deno test --allow-env supabase/functions/tomorrow-live-realtime-session/index_test.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun x tsc --noEmit
      - name: ESLint
        run: >
          bun x eslint
          supabase/functions/tomorrow-live-realtime-session/core.ts
          supabase/functions/tomorrow-live-realtime-session/index_test.ts
      - name: Production build
        run: bun run build
