name: ORION v0.6 APK Build

on:
  push:
    branches: ['build/orion-auto-v0-6']
    paths:
      - '.orion-v06hex/**'
      - '.github/workflows/orion-v06-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ORION v0.5 source
        run: |
          mkdir -p /tmp/orion-v06
          cat .orion-v04zip/part00 .orion-v04zip/part01 .orion-v04zip/part02 .orion-v04zip/part03 .orion-v04zip/part04 | base64 -d > /tmp/orion-v04-project.zip
          echo '7b658ccc27e53379f46e76c93fc64ee1135a6a085492c023b86a51e1e861f657  /tmp/orion-v04-project.zip' | sha256sum -c -
          unzip -q /tmp/orion-v04-project.zip -d /tmp/orion-v06
          cat .orion-v05hex/part00 .orion-v05hex/part01 .orion-v05hex/block02 .orion-v05hex/block03 .orion-v05hex/block04 .orion-v05hex/block05 .orion-v05hex/block06 | xxd -r -p > /tmp/orion-v05.patch.gz
          echo '15e0a6fbfd609391bfa08ba29a8bbe2bd141905b7d5ac25aa66adf4eea981e19  /tmp/orion-v05.patch.gz' | sha256sum -c -
          gzip -dc /tmp/orion-v05.patch.gz > /tmp/orion-v05.patch
          echo 'e4e12e7bec897a8b06393ad37a43ea7e63aa6f1a21c730da9946184088beefaf  /tmp/orion-v05.patch' | sha256sum -c -
          cd /tmp/orion-v06
          patch -p1 < /tmp/orion-v05.patch
          grep -q 'versionCode 5' orion-android/app/build.gradle
          grep -q "versionName '0.5.0'" orion-android/app/build.gradle

      - name: Apply ORION v0.6 assistant-role patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = ''.join(Path(p).read_text().strip() for p in [
              '.orion-v06hex/part00', '.orion-v06hex/part01', '.orion-v06hex/part02'
          ])
          Path('/tmp/orion-v06.patch.gz').write_bytes(bytes.fromhex(text))
          PY
          echo '519f784bec7ea0d7b40511117c30ceb891a0a8074839fad43cccf952ebac3d28  /tmp/orion-v06.patch.gz' | sha256sum -c -
          gzip -dc /tmp/orion-v06.patch.gz > /tmp/orion-v06.patch
          echo 'd5686149cf0f86c550f345ccd61f1ef3f191576496b87e4e5cce28f680a1073f  /tmp/orion-v06.patch' | sha256sum -c -
          cd /tmp/orion-v06
          patch -p4 < /tmp/orion-v06.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('orion-android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          action = '                <action android:name="android.media.action.MEDIA_PLAY_FROM_SEARCH" />'
          if action not in s:
              needle = '                <action android:name="android.media.browse.MediaBrowserService" />'
              if needle not in s:
                  raise SystemExit('MediaBrowserService intent action not found')
              s = s.replace(needle, needle + '\n' + action)
              p.write_text(s)
          PY
          grep -q 'versionCode 6' orion-android/app/build.gradle
          grep -q "versionName '0.6.0'" orion-android/app/build.gradle
          grep -q 'android.service.voice.VoiceInteractionService' orion-android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.VOICE_COMMAND' orion-android/app/src/main/AndroidManifest.xml
          grep -q 'android.media.action.MEDIA_PLAY_FROM_SEARCH' orion-android/app/src/main/AndroidManifest.xml
          grep -q 'RoleManager.ROLE_ASSISTANT' orion-android/app/src/main/java/com/orion/auto/MainActivity.java
          test -f orion-android/app/src/main/java/com/orion/auto/OrionVoiceInteractionService.java
          test -f orion-android/app/src/main/java/com/orion/auto/OrionVoiceInteractionSessionService.java
          test -f orion-android/app/src/main/java/com/orion/auto/OrionVoiceInteractionSession.java
          test -f orion-android/app/src/main/java/com/orion/auto/OrionRecognitionService.java
          test -f orion-android/app/src/main/res/xml/voice_interaction_service.xml
          test -f orion-android/app/src/main/res/xml/recognition_service.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle -p /tmp/orion-v06/orion-android --no-daemon testDebugUnitTest

      - name: Android lint
        run: |
          if ! gradle -p /tmp/orion-v06/orion-android --no-daemon lintDebug; then
            REPORT=/tmp/orion-v06/orion-android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            test -f "$REPORT" && grep -n 'Error:' "$REPORT" || true
            exit 1
          fi

      - name: Build installable debug APK
        run: gradle -p /tmp/orion-v06/orion-android --no-daemon assembleDebug

      - name: Verify APK and package evidence
        run: |
          mkdir -p dist
          APK=/tmp/orion-v06/orion-android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" dist/ORION-v0.6.apk
          sha256sum dist/ORION-v0.6.apk | tee dist/SHA256SUMS.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ORION-v0.6.apk | tee dist/apksigner.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging dist/ORION-v0.6.apk | tee dist/badging.txt
          cp -r /tmp/orion-v06/orion-android/app/build/reports/tests/testDebugUnitTest dist/unit-tests
          cp /tmp/orion-v06/orion-android/app/build/reports/lint-results-debug.html dist/lint-results.html

      - name: Upload APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: ORION-v0.6-android
          path: dist/
          if-no-files-found: error
          retention-days: 14
