name: Validação temporária — navegação explícita

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Testes focados
        run: >-
          bunx vitest run
          src/lib/offerHandoff.test.ts
          src/hooks/useRealtimeVoice.test.tsx
          src/pages/opportunitiesLiveHandoff.test.tsx
          src/components/opportunities/live/LiveOfferOverlay.test.tsx
      - name: TypeScript
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: ESLint do escopo
        run: >-
          bunx eslint
          src/lib/offerHandoff.ts
          src/lib/offerHandoff.test.ts
          src/hooks/useRealtimeVoice.ts
          src/hooks/useRealtimeVoice.test.tsx
          src/pages/OpportunitiesLive.tsx
          src/pages/opportunitiesLiveHandoff.test.tsx
          src/components/opportunities/live/LiveOfferOverlay.test.tsx
          supabase/functions/tomorrow-live-realtime-session/core.ts
          supabase/functions/tomorrow-live-realtime-session/index_test.ts
      - name: Build
        run: bun run build
      - name: Teste Deno da Edge Function
        run: deno test supabase/functions/tomorrow-live-realtime-session/index_test.ts
