name: Temporary Live smooth UI validation

on:
  push:
    branches:
      - fix/live-smooth-ui-transitions
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies despite historical lock drift
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Focused Vitest
        run: npx vitest run src/pages/opportunitiesLive.test.tsx
      - name: Scoped ESLint
        run: npx eslint src/pages/OpportunitiesLive.tsx src/pages/opportunitiesLive.test.tsx src/components/opportunities/live/LiveOfferOverlay.tsx src/components/opportunities/live/LiveParticleGlobe.tsx
      - name: TypeScript excluding known historical error
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
          set -e
          cat /tmp/tsc.log
          unexpected=$(grep "error TS" /tmp/tsc.log | grep -v "src/components/admin/QuoteEditForm.tsx" || true)
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
