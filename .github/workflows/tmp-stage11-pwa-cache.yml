name: Temporary Stage 11 PWA cache validation

on:
  push:
    branches:
      - perf/stage11-pwa-asset-cache
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Vite config ESLint
        run: npx eslint vite.config.ts
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Production build
        run: npm run build
      - name: Verify generated service worker
        run: |
          test -s dist/sw.js
          grep -q "tomorrow-local-images-v1" dist/sw.js
      - name: Diff check
        run: git diff --check origin/main...HEAD
