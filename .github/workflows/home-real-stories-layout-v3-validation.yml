name: Home Real Stories Layout V3 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/landing/RealStories.tsx'
      - '.github/workflows/home-real-stories-layout-v3-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint scoped
        run: npx eslint src/components/landing/RealStories.tsx
      - name: Build
        run: npm run build
