name: Temporary Tomorrow Live centered gold quality gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/OpportunitiesLive.tsx'
      - 'src/pages/opportunitiesLive.test.tsx'
      - 'src/components/opportunities/live/LiveParticleGlobe.tsx'
      - 'src/components/opportunities/live/LiveWaveBackdrop.tsx'
      - '.github/workflows/temp-live-centered-gold-stage.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Focused Live tests
        run: npx vitest run src/pages/opportunitiesLive.test.tsx
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scoped ESLint
        run: npx eslint src/pages/OpportunitiesLive.tsx src/pages/opportunitiesLive.test.tsx src/components/opportunities/live/LiveParticleGlobe.tsx src/components/opportunities/live/LiveWaveBackdrop.tsx
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
