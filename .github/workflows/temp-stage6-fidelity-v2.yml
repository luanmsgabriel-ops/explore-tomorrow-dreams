name: temp-stage6-fidelity-v2

on:
  push:
    branches:
      - stage-6-reference-fidelity-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Focused tests
        run: bunx vitest run src/components/opportunities/live/LiveWaveBackdrop.test.tsx
      - name: TypeScript
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: ESLint scope
        run: bunx eslint src/components/opportunities/live/LiveWaveBackdrop.tsx src/components/opportunities/live/liveGlobeEffects.ts
      - name: Build
        run: bun run build
