name: Temporary Live greeting and comparison quality gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/hooks/useRealtimeVoice.ts'
      - 'src/hooks/useRealtimeVoice.test.tsx'
      - 'src/components/opportunities/live/LiveOfferOverlay.tsx'
      - 'src/components/opportunities/live/LiveOfferOverlay.test.tsx'
      - 'supabase/functions/tomorrow-live-realtime-session/**'
      - '.github/workflows/temp-live-greeting-cards-quality.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Focused Vitest
        run: bunx vitest run src/hooks/useRealtimeVoice.test.tsx src/components/opportunities/live/LiveOfferOverlay.test.tsx
      - name: ESLint scope
        run: bunx eslint src/hooks/useRealtimeVoice.ts src/hooks/useRealtimeVoice.test.tsx src/components/opportunities/live/LiveOfferOverlay.tsx src/components/opportunities/live/LiveOfferOverlay.test.tsx
      - name: TypeScript
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: Deno check
        run: deno check supabase/functions/tomorrow-live-realtime-session/core.ts supabase/functions/tomorrow-live-realtime-session/index.ts
      - name: Deno tests
        run: deno test supabase/functions/tomorrow-live-realtime-session/index_test.ts
      - name: Production build
        run: bun run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
