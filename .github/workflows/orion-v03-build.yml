name: ORION v0.3 APK Build

on:
  push:
    branches: ['build/orion-auto-v0-3']
    paths:
      - '.orion-v03/**'
      - '.github/workflows/orion-v03-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore v0.1 source
        run: |
          mkdir -p /tmp/orion-build
          cat .orion-build/part00 .orion-build/part01 .orion-build/part02 .orion-build/part03 .orion-build/part04 | base64 -d > /tmp/orion-project.zip
          echo '8fa12d5769b036ea24e09e19004c236b1bdd9b77b082aa2366e4c02409640239  /tmp/orion-project.zip' | sha256sum -c -
          unzip -t /tmp/orion-project.zip
          unzip -q /tmp/orion-project.zip -d /tmp/orion-build
          test -f /tmp/orion-build/orion-android/app/build.gradle

      - name: Apply v0.2 approved voice base
        run: |
          cp .orion-v02/OrionView.java /tmp/orion-build/orion-android/app/src/main/java/com/orion/auto/OrionView.java
          cp .orion-v02/OpenAiSpeechClient.java /tmp/orion-build/orion-android/app/src/main/java/com/orion/auto/OpenAiSpeechClient.java
          cd /tmp/orion-build/orion-android
          patch -p0 < "$GITHUB_WORKSPACE/.orion-v02/MainActivity.patch"
          sed -i "s/versionCode 1/versionCode 2/; s/versionName '0.1.0'/versionName '0.2.0'/" app/build.gradle
          grep -q 'gpt-4o-mini-tts' app/src/main/java/com/orion/auto/OpenAiSpeechClient.java

      - name: Apply v0.3 faithful humanoid and speech effects
        run: |
          cp "$GITHUB_WORKSPACE/.orion-v03/OrionView.java" /tmp/orion-build/orion-android/app/src/main/java/com/orion/auto/OrionView.java
          mkdir -p /tmp/orion-build/orion-android/app/src/main/res/drawable-nodpi
          cat "$GITHUB_WORKSPACE/.orion-v03/reference.part00" "$GITHUB_WORKSPACE/.orion-v03/reference.part01" "$GITHUB_WORKSPACE/.orion-v03/reference.part02" "$GITHUB_WORKSPACE/.orion-v03/reference.part03" | base64 -d > /tmp/orion-build/orion-android/app/src/main/res/drawable-nodpi/orion_reference.webp
          echo 'de69f8d20cd733b08d9db41cd6af793d0caedd0815b1549af9cd092a60561429  /tmp/orion-build/orion-android/app/src/main/res/drawable-nodpi/orion_reference.webp' | sha256sum -c -
          cd /tmp/orion-build/orion-android
          sed -i "s/versionCode 2/versionCode 3/; s/versionName '0.2.0'/versionName '0.3.0'/" app/build.gradle
          sed -i 's/v0.2 • voz masculina neural + Maps + Spotify + IA/v0.3 • visual fiel + voz masculina neural + Maps + Spotify + IA/' app/src/main/java/com/orion/auto/MainActivity.java
          grep -q 'versionCode 3' app/build.gradle
          grep -q "versionName '0.3.0'" app/build.gradle
          grep -q 'R.drawable.orion_reference' app/src/main/java/com/orion/auto/OrionView.java
          test -s app/src/main/res/drawable-nodpi/orion_reference.webp

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle -p /tmp/orion-build/orion-android --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle -p /tmp/orion-build/orion-android --no-daemon lintDebug

      - name: Build installable debug APK
        run: gradle -p /tmp/orion-build/orion-android --no-daemon assembleDebug

      - name: Verify APK and package evidence
        run: |
          mkdir -p dist
          APK=/tmp/orion-build/orion-android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" dist/ORION-v0.3.apk
          sha256sum dist/ORION-v0.3.apk | tee dist/SHA256SUMS.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ORION-v0.3.apk | tee dist/apksigner.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging dist/ORION-v0.3.apk | tee dist/badging.txt
          cp -r /tmp/orion-build/orion-android/app/build/reports/tests/testDebugUnitTest dist/unit-tests
          cp /tmp/orion-build/orion-android/app/build/reports/lint-results-debug.html dist/lint-results.html

      - name: Upload APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: ORION-v0.3-android
          path: dist/
          if-no-files-found: error
          retention-days: 14
