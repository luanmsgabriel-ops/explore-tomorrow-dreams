name: ORION v0.5 APK Build

on:
  push:
    branches: ['build/orion-auto-v0-5']
    paths:
      - '.orion-v05/**'
      - '.github/workflows/orion-v05-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ORION v0.4 source
        run: |
          mkdir -p /tmp/orion-v05
          cat .orion-v04zip/part00 .orion-v04zip/part01 .orion-v04zip/part02 .orion-v04zip/part03 .orion-v04zip/part04 | base64 -d > /tmp/orion-v04-project.zip
          echo '7b658ccc27e53379f46e76c93fc64ee1135a6a085492c023b86a51e1e861f657  /tmp/orion-v04-project.zip' | sha256sum -c -
          unzip -q /tmp/orion-v04-project.zip -d /tmp/orion-v05
          test -f /tmp/orion-v05/orion-android/app/build.gradle

      - name: Apply ORION v0.5 Android Auto + phone capabilities patch
        run: |
          cat .orion-v05/patch00 .orion-v05/patch01 .orion-v05/patch02 | base64 -d | gzip -dc > /tmp/orion-v05.patch
          cd /tmp/orion-v05
          patch -p1 < /tmp/orion-v05.patch
          grep -q 'versionCode 5' orion-android/app/build.gradle
          grep -q "versionName '0.5.0'" orion-android/app/build.gradle
          grep -q 'com.google.android.gms.car.application' orion-android/app/src/main/AndroidManifest.xml
          grep -q 'android.media.browse.MediaBrowserService' orion-android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' orion-android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_FINE_LOCATION' orion-android/app/src/main/AndroidManifest.xml
          grep -q 'OrionNotificationListener' orion-android/app/src/main/AndroidManifest.xml
          test -f orion-android/app/src/main/java/com/orion/auto/PermissionCenterActivity.java
          test -f orion-android/app/src/main/java/com/orion/auto/OpenAiVisionClient.java
          test -f orion-android/app/src/main/java/com/orion/auto/OrionMediaService.java
          test -f orion-android/app/src/main/res/xml/automotive_app_desc.xml
          ! grep -q 'READ_SMS\|READ_CALL_LOG\|BIND_ACCESSIBILITY_SERVICE' orion-android/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle -p /tmp/orion-v05/orion-android --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle -p /tmp/orion-v05/orion-android --no-daemon lintDebug

      - name: Build installable debug APK
        run: gradle -p /tmp/orion-v05/orion-android --no-daemon assembleDebug

      - name: Verify APK and package evidence
        run: |
          mkdir -p dist
          APK=/tmp/orion-v05/orion-android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" dist/ORION-v0.5.apk
          sha256sum dist/ORION-v0.5.apk | tee dist/SHA256SUMS.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ORION-v0.5.apk | tee dist/apksigner.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging dist/ORION-v0.5.apk | tee dist/badging.txt
          cp -r /tmp/orion-v05/orion-android/app/build/reports/tests/testDebugUnitTest dist/unit-tests
          cp /tmp/orion-v05/orion-android/app/build/reports/lint-results-debug.html dist/lint-results.html

      - name: Upload APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: ORION-v0.5-android
          path: dist/
          if-no-files-found: error
          retention-days: 14
