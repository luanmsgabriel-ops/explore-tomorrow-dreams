name: ORION v0.4 APK Build

on:
  push:
    branches: ['build/orion-auto-v0-4']
    paths:
      - '.orion-v04zip/**'
      - '.github/workflows/orion-v04-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify ORION v0.4 source
        run: |
          mkdir -p /tmp/orion-v04
          cat .orion-v04zip/part00 .orion-v04zip/part01 .orion-v04zip/part02 .orion-v04zip/part03 .orion-v04zip/part04 | base64 -d > /tmp/orion-v04-project.zip
          echo '7b658ccc27e53379f46e76c93fc64ee1135a6a085492c023b86a51e1e861f657  /tmp/orion-v04-project.zip' | sha256sum -c -
          unzip -t /tmp/orion-v04-project.zip
          unzip -q /tmp/orion-v04-project.zip -d /tmp/orion-v04
          test -f /tmp/orion-v04/orion-android/app/build.gradle
          grep -q 'versionCode 4' /tmp/orion-v04/orion-android/app/build.gradle
          grep -q "versionName '0.4.0'" /tmp/orion-v04/orion-android/app/build.gradle
          test ! -e /tmp/orion-v04/orion-android/app/src/main/res/drawable-nodpi/orion_reference.webp
          grep -q 'setVoiceLevel' /tmp/orion-v04/orion-android/app/src/main/java/com/orion/auto/OrionView.java
          grep -q 'Visualizer' /tmp/orion-v04/orion-android/app/src/main/java/com/orion/auto/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle -p /tmp/orion-v04/orion-android --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle -p /tmp/orion-v04/orion-android --no-daemon lintDebug

      - name: Build installable debug APK
        run: gradle -p /tmp/orion-v04/orion-android --no-daemon assembleDebug

      - name: Verify APK and package evidence
        run: |
          mkdir -p dist
          APK=/tmp/orion-v04/orion-android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" dist/ORION-v0.4.apk
          sha256sum dist/ORION-v0.4.apk | tee dist/SHA256SUMS.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ORION-v0.4.apk | tee dist/apksigner.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging dist/ORION-v0.4.apk | tee dist/badging.txt
          cp -r /tmp/orion-v04/orion-android/app/build/reports/tests/testDebugUnitTest dist/unit-tests
          cp /tmp/orion-v04/orion-android/app/build/reports/lint-results-debug.html dist/lint-results.html

      - name: Upload APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: ORION-v0.4-android
          path: dist/
          if-no-files-found: error
          retention-days: 14
