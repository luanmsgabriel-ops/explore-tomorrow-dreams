name: Validate Viator live discovery fix

on:
  push:
    branches:
      - fix/trip-composer-viator-live-search

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deno check Viator edge
        run: deno check supabase/functions/trip-composer-viator/index.ts
      - name: Deno tests Trip Composer Viator and Window
        run: deno test supabase/functions/_shared/trip-composer-viator.test.ts supabase/functions/_shared/trip-composer-window.test.ts
      - name: Assert Viator production search contract
        run: |
          grep -q 'https://api.viator.com/partner' supabase/functions/trip-composer-viator/index.ts
          grep -q 'REVIEW_AVG_RATING' supabase/functions/trip-composer-viator/index.ts
          ! grep -q 'TRAVELER_RATING' supabase/functions/trip-composer-viator/index.ts
      - name: Install frontend dependencies
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
