name: Stage 7 mobile globe microphone

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Focused tests
        run: bunx vitest run src/pages/opportunitiesLive.test.tsx src/hooks/useRealtimeVoice.test.tsx src/components/opportunities/live/LiveWaveBackdrop.test.tsx
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: ESLint
        run: bunx eslint src/components/opportunities/live/LiveParticleGlobe.tsx src/pages/OpportunitiesLive.tsx src/pages/opportunitiesLive.test.tsx
      - name: Production build
        run: bun run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
