name: Tomorrow Live ASTRA Validation

on:
  push:
    branches:
      - feat/tomorrow-live-astra-evolution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Tomorrow Live tests
        run: >-
          bun run test --
          src/lib/liveRoute.test.ts
          src/lib/liveSessionModel.test.ts
          src/lib/realtimeVoice.test.ts
          src/components/opportunities/live/LiveTranscriptDrawer.test.tsx
          src/pages/opportunitiesLive.test.tsx

      - name: Build production bundle
        run: bun run build
