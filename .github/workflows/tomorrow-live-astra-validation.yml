name: Tomorrow Live ASTRA Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/App.tsx"
      - "src/pages/OpportunitiesLive.tsx"
      - "src/pages/opportunitiesLive.test.tsx"
      - "src/components/opportunities/live/**"
      - "src/hooks/useRealtimeVoice.ts"
      - "src/hooks/useTripComposerRuntime.ts"
      - "src/hooks/useTomorrowLiveTelemetry.ts"
      - "src/hooks/useTomorrowLiveTelemetry.test.tsx"
      - "src/lib/liveRoute.ts"
      - "src/lib/liveRoute.test.ts"
      - "src/lib/liveSessionModel.ts"
      - "src/lib/liveSessionModel.test.ts"
      - "src/lib/realtimeVoice.ts"
      - "src/lib/realtimeVoice.test.ts"
      - "src/lib/tripComposerApi.ts"
      - "src/lib/tripComposerRealtime.ts"
      - "supabase/functions/tomorrow-live-*/**"
      - "supabase/functions/_shared/realtimeSession.ts"
      - ".github/workflows/tomorrow-live-astra-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/App.tsx"
      - "src/pages/OpportunitiesLive.tsx"
      - "src/pages/opportunitiesLive.test.tsx"
      - "src/components/opportunities/live/**"
      - "src/hooks/useRealtimeVoice.ts"
      - "src/hooks/useTripComposerRuntime.ts"
      - "src/hooks/useTomorrowLiveTelemetry.ts"
      - "src/hooks/useTomorrowLiveTelemetry.test.tsx"
      - "src/lib/liveRoute.ts"
      - "src/lib/liveRoute.test.ts"
      - "src/lib/liveSessionModel.ts"
      - "src/lib/liveSessionModel.test.ts"
      - "src/lib/realtimeVoice.ts"
      - "src/lib/realtimeVoice.test.ts"
      - "src/lib/tripComposerApi.ts"
      - "src/lib/tripComposerRealtime.ts"
      - "supabase/functions/tomorrow-live-*/**"
      - "supabase/functions/_shared/realtimeSession.ts"
      - ".github/workflows/tomorrow-live-astra-validation.yml"
  workflow_dispatch:

concurrency:
  group: tomorrow-live-astra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Tomorrow Live tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run test -- \
            src/lib/liveRoute.test.ts \
            src/lib/liveSessionModel.test.ts \
            src/lib/realtimeVoice.test.ts \
            src/hooks/useTomorrowLiveTelemetry.test.tsx \
            src/components/opportunities/live/LiveRouteGlobe.test.tsx \
            src/components/opportunities/live/LiveSessionCockpit.test.tsx \
            src/components/opportunities/live/LiveTranscriptDrawer.test.tsx \
            src/components/opportunities/live/TripComposerLiveSection.test.tsx \
            src/pages/opportunitiesLive.test.tsx 2>&1 | tee tomorrow-live-tests.log

      - name: Type-check application
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bunx tsc -b --pretty false 2>&1 | tee tomorrow-live-typecheck.log

      - name: Build production bundle
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee tomorrow-live-build.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tomorrow-live-astra-logs
          path: |
            tomorrow-live-tests.log
            tomorrow-live-typecheck.log
            tomorrow-live-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce gate
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.tests.outcome }}" != "success" || "${{ steps.typecheck.outcome }}" != "success" || "${{ steps.build.outcome }}" != "success" ]]; then
            echo "Tomorrow Live ASTRA gate failed."
            exit 1
          fi
