name: Temporary stage 10 quality gate

on:
  push:
    branches:
      - fix/stage10-reconcile-quality-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies despite historical lock drift
        run: npm install --package-lock=false --ignore-scripts

      - name: Vitest
        run: npx vitest run --passWithNoTests

      - name: Edge Function tests
        run: deno test --node-modules-dir=auto supabase/functions/travel-offers-public/*_test.ts supabase/functions/tomorrow-live-realtime-session/*_test.ts

      - name: ESLint
        shell: bash
        run: |
          set +e
          npx eslint src -f json -o eslint-report.json
          status=$?
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('eslint-report.json', 'utf8'));
          const rows = report.flatMap((file) => file.messages
            .filter((message) => message.severity === 2)
            .map((message) => ({
              file: file.filePath.replace(process.cwd() + '/', ''),
              line: message.line,
              column: message.column,
              rule: message.ruleId,
              message: message.message,
            })));
          console.log(`ESLINT_ERRORS=${rows.length}`);
          for (const row of rows) console.log(JSON.stringify(row));
          NODE
          exit $status

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Diff check
        run: git diff --check origin/main...HEAD
