name: Travel Match Generated Visuals Validation
on:
  pull_request:
    paths:
      - 'public/travel-match/generated-sprite.jpg'
      - 'src/lib/travelMatchVisuals.ts'
      - 'src/lib/progressiveTravelProfile.ts'
      - 'src/pages/MyTomorrowWelcome.tsx'
      - 'src/pages/MyTomorrowProfileRefine.tsx'
      - '.github/workflows/travel-match-generated-visuals-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint src/lib/travelMatchVisuals.ts src/lib/progressiveTravelProfile.ts src/pages/MyTomorrowWelcome.tsx src/pages/MyTomorrowProfileRefine.tsx
      - run: npm run build
      - run: git diff --check origin/${{ github.base_ref }}...HEAD
