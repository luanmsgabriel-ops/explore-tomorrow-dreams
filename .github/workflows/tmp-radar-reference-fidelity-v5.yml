name: Temporary Radar Reference Fidelity V5

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-package-lock
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scoped ESLint
        run: npx eslint src/components/my-tomorrow/RadarSignalGlobe.tsx src/pages/MyTomorrowRadarDetail.tsx
      - name: Focused tests
        run: npx vitest run src/components/my-tomorrow/RadarSignalGlobe.test.tsx
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
