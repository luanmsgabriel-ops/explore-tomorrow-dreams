name: Temporary GPT-Live-1 Voice Lab Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/components/opportunities/live/LiveVoiceLab.tsx'
      - 'src/hooks/useGptLiveVoiceLab.ts'
      - 'src/lib/gptLiveVoiceLab.ts'
      - 'src/pages/OpportunitiesLiveVoiceLab.tsx'
      - 'supabase/config.toml'
      - 'supabase/functions/tomorrow-live-gpt-live-call/**'
      - '.github/workflows/tmp-gpt-live-voice-lab-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint focused scope
        run: npx eslint src/App.tsx src/components/opportunities/live/LiveVoiceLab.tsx src/hooks/useGptLiveVoiceLab.ts src/lib/gptLiveVoiceLab.ts src/pages/OpportunitiesLiveVoiceLab.tsx
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge function tests
        run: deno test --allow-env supabase/functions/tomorrow-live-gpt-live-call/index_test.ts
