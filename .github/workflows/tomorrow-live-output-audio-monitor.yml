name: Tomorrow Live output audio monitor

on:
  pull_request:
    branches: [main]
    paths:
      - "src/hooks/useRealtimeVoice.ts"
      - "src/hooks/useRealtimeVoice.test.tsx"
      - "src/lib/realtimeVoice.ts"
      - "src/lib/realtimeVoice.test.ts"
      - "src/pages/OpportunitiesLive.tsx"
      - "src/pages/opportunitiesLive.test.tsx"
      - "src/components/opportunities/live/**"
      - "docs/TOMORROW_LIVE_MASTER_PLAN.md"
      - "docs/TOMORROW_LIVE_STAGE_7_OUTPUT_AUDIO_MONITOR.md"
      - ".github/workflows/tomorrow-live-output-audio-monitor.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Focused tests
        run: >
          bun x vitest run
          src/components/opportunities/live/LiveParticleGlobe.test.ts
          src/components/opportunities/live/LiveWaveBackdrop.test.tsx
          src/components/opportunities/live/liveGlobeEffects.test.ts
          src/hooks/useRealtimeVoice.test.tsx
          src/lib/realtimeVoice.test.ts
          src/pages/opportunitiesLive.test.tsx
      - name: TypeScript
        run: bun x tsc --noEmit
      - name: ESLint
        run: >
          bun x eslint
          src/hooks/useRealtimeVoice.ts
          src/hooks/useRealtimeVoice.test.tsx
          src/lib/realtimeVoice.ts
          src/pages/OpportunitiesLive.tsx
          src/components/opportunities/live/LiveParticleGlobe.tsx
      - name: Production build
        run: bun run build
