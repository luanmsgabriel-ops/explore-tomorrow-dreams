name: Travel Match Mobile Performance
on:
  pull_request:
    paths:
      - 'src/pages/MyTomorrowWelcome.tsx'
      - '.github/workflows/travel-match-mobile-performance.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint src/pages/MyTomorrowWelcome.tsx
      - run: npm run build
      - run: git diff --check origin/${{ github.base_ref }}...HEAD
