name: Calendar correction validation

on:
  push:
    branches:
      - fix/calendar-route-filters

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vitest
        run: bun run test

      - name: TypeScript
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: ESLint focused scope
        run: bunx eslint src/pages/OpportunitiesCalendar.tsx src/pages/opportunitiesCalendar.test.tsx src/lib/opportunityCalendar.ts src/lib/opportunityCalendar.test.ts src/lib/travelOffersPublic.ts src/lib/travelOffersPublic.test.ts

      - name: Vite PWA build
        run: bun run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Function check
        run: deno check supabase/functions/travel-offers-public/index.ts

      - name: Edge Function tests
        run: deno test supabase/functions/travel-offers-public/calendar_facets_test.ts
