name: Temporary stage 9 public curation edit

on:
  push:
    branches:
      - feat/stage-9-public-curation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage-9-public-curation
          fetch-depth: 0

      - name: Apply exact source transformations
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          core = "supabase/functions/travel-offers-public/core.ts"
          client = "src/lib/travelOffersPublic.ts"

          replace_once(
              core,
              'const SORTS = ["price_asc", "price_desc", "date_asc", "date_desc", "updated_desc"] as const;',
              'const SORTS = ["editorial", "price_asc", "price_desc", "date_asc", "date_desc", "updated_desc"] as const;',
          )

          replace_once(
              core,
              '  raw_data?: JsonRecord | null;\n};',
              '  raw_data?: JsonRecord | null;\n  curation_featured?: boolean | null;\n  curation_sort_order?: number | null;\n  curation_campaign_label?: string | null;\n  curation_subtitle?: string | null;\n};',
          )

          replace_once(
              core,
              '  updated_at: publicText(row.updated_at, 40),\n});',
              '  updated_at: publicText(row.updated_at, 40),\n  featured: row.curation_featured === true,\n  editorial_order: Number.isInteger(row.curation_sort_order) ? row.curation_sort_order as number : 0,\n  campaign_label: publicText(row.curation_campaign_label, 80),\n  editorial_subtitle: publicText(row.curation_subtitle, 320),\n});',
          )

          replace_once(
              core,
              '      image_url: null,\n      updated_at: detail.updated_at,',
              '      image_url: null,\n      featured: detail.featured,\n      editorial_order: detail.editorial_order,\n      campaign_label: detail.campaign_label,\n      editorial_subtitle: detail.editorial_subtitle,\n      updated_at: detail.updated_at,',
          )

          replace_once(
              core,
              '    image_url: detail.image_url,\n    updated_at: detail.updated_at,',
              '    image_url: detail.image_url,\n    featured: detail.featured,\n    editorial_order: detail.editorial_order,\n    campaign_label: detail.campaign_label,\n    editorial_subtitle: detail.editorial_subtitle,\n    updated_at: detail.updated_at,',
          )

          replace_once(
              core,
              '  "raw_data",\n].join(",");',
              '  "raw_data",\n  "curation_featured",\n  "curation_sort_order",\n  "curation_campaign_label",\n  "curation_subtitle",\n].join(",");',
          )

          replace_once(
              core,
              '    .from("travel_offers")\n',
              '    .from("travel_offers_curated_source")\n',
          )

          old_orders = '''  const orders: Record<Sort, [string, boolean]> = {\n    price_asc: ["price_per_person", true],\n    price_desc: ["price_per_person", false],\n    date_asc: ["departure_date", true],\n    date_desc: ["departure_date", false],\n    updated_desc: ["updated_at", false],\n  };\n  const [column, ascending] = orders[params.sort];\n  query = query.order(column, { ascending }).order("id", { ascending: true });'''
          new_orders = '''  if (params.sort === "editorial") {\n    query = query\n      .order("curation_featured", { ascending: false })\n      .order("curation_sort_order", { ascending: true })\n      .order("departure_date", { ascending: true })\n      .order("id", { ascending: true });\n  } else {\n    const orders: Record<Exclude<Sort, "editorial">, [string, boolean]> = {\n      price_asc: ["price_per_person", true],\n      price_desc: ["price_per_person", false],\n      date_asc: ["departure_date", true],\n      date_desc: ["departure_date", false],\n      updated_desc: ["updated_at", false],\n    };\n    const [column, ascending] = orders[params.sort];\n    query = query.order(column, { ascending }).order("id", { ascending: true });\n  }'''
          replace_once(core, old_orders, new_orders)

          replace_once(
              client,
              'export type CatalogSort = "price_asc" | "price_desc" | "date_asc" | "date_desc" | "updated_desc";',
              'export type CatalogSort = "editorial" | "price_asc" | "price_desc" | "date_asc" | "date_desc" | "updated_desc";',
          )

          replace_once(
              client,
              '  image_url: string | null;\n  updated_at: string | null;\n}',
              '  image_url: string | null;\n  featured: boolean;\n  editorial_order: number;\n  campaign_label: string | null;\n  editorial_subtitle: string | null;\n  updated_at: string | null;\n}',
          )

          replace_once(
              client,
              '  available_seats: number | null;\n  updated_at: string | null;\n  price_per_person: number;',
              '  available_seats: number | null;\n  featured: boolean;\n  editorial_order: number;\n  campaign_label: string | null;\n  editorial_subtitle: string | null;\n  updated_at: string | null;\n  price_per_person: number;',
          )

          Path(".github/workflows/tmp-stage9-public-curation-edit.yml").unlink()

      - name: Commit deterministic edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/travel-offers-public/core.ts src/lib/travelOffersPublic.ts .github/workflows/tmp-stage9-public-curation-edit.yml
          git diff --cached --check
          git commit -m "Etapa 9: integrar curadoria à camada pública"
          git push origin HEAD:feat/stage-9-public-curation
