name: Radar Immersive Builder Validation
on:
  pull_request:
    paths:
      - 'src/pages/MyTomorrowRadarCreate.tsx'
      - 'src/pages/MyTomorrowRadars.tsx'
      - '.github/workflows/radar-immersive-builder-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scoped ESLint
        run: npx eslint src/pages/MyTomorrowRadarCreate.tsx src/pages/MyTomorrowRadars.tsx
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
