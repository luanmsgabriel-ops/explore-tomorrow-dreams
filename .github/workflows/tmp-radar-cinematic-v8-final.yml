name: Temporary Radar Cinematic V8 Final

on:
  push:
    branches:
      - feat/radar-cinematic-renderer-v8-final

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-package-lock --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scoped ESLint
        run: npx eslint src/components/my-tomorrow/RadarSignalGlobe.tsx src/components/my-tomorrow/RadarSignalGlobe.test.tsx src/pages/MyTomorrowRadarDetail.tsx
      - name: Focused tests
        run: npx vitest run src/components/my-tomorrow/RadarSignalGlobe.test.tsx
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
