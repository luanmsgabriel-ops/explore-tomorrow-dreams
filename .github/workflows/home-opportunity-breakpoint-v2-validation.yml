name: Home Opportunity Breakpoint V2 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/landing/HomeOpportunityShowcase.tsx'
      - '.github/workflows/home-opportunity-breakpoint-v2-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx eslint src/components/landing/HomeOpportunityShowcase.tsx
      - run: npm run build
