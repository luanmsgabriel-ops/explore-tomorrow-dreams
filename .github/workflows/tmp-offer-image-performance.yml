name: Temporary offer image performance validation

on:
  push:
    branches:
      - perf/offer-image-cache
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Focused Vitest
        run: npx vitest run src/lib/offerImages.test.ts src/components/opportunities/opportunities.test.tsx

      - name: Scoped ESLint
        run: >-
          npx eslint
          src/lib/offerImages.ts
          src/lib/offerImages.test.ts
          src/components/opportunities/DeferredOfferImage.tsx
          src/components/opportunities/OpportunityCard.tsx

      - name: TypeScript excluding known historical error
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
          code=$?
          set -e
          cat /tmp/tsc.log
          unexpected=$(grep "error TS" /tmp/tsc.log | grep -v "src/components/admin/QuoteEditForm.tsx" || true)
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi
          if [ "$code" -ne 0 ] && ! grep -q "src/components/admin/QuoteEditForm.tsx" /tmp/tsc.log; then
            exit "$code"
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Function contract tests
        run: deno test supabase/functions/travel-offer-image/core_test.ts

      - name: Edge Function type check
        run: deno check supabase/functions/travel-offer-image/index.ts

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check origin/main...HEAD
