name: Temporary Admin WhatsApp Validate

on:
  push:
    branches:
      - fix/admin-whatsapp-inbox

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Focused tests
        run: npx vitest run src/components/admin/whatsappMessageUtils.test.ts
      - name: Scoped ESLint
        run: npx eslint src/components/admin/WhatsAppManager.tsx src/components/admin/whatsappMessageUtils.ts src/components/admin/whatsappMessageUtils.test.ts
      - name: TypeScript
        run: npx tsc -p tsconfig.app.json --noEmit --pretty false
      - name: Build
        run: npm run build
