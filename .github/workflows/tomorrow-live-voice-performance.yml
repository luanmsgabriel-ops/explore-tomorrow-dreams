name: Tomorrow Live voice performance

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/App.tsx"
      - "src/components/opportunities/live/**"
      - "src/hooks/useRealtimeVoice.ts"
      - "src/hooks/useRealtimeVoice.test.tsx"
      - "docs/TOMORROW_LIVE_**"
      - ".github/workflows/tomorrow-live-voice-performance.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Focused tests
        run: bun x vitest run src/hooks/useRealtimeVoice.test.tsx src/lib/realtimeVoice.test.ts src/components/opportunities/live/LiveParticleGlobe.test.ts src/components/opportunities/live/liveGlobeEffects.test.ts src/components/opportunities/live/LiveWaveBackdrop.test.tsx

      - name: TypeScript
        run: bun x tsc --noEmit

      - name: ESLint scope
        run: bun x eslint src/App.tsx src/hooks/useRealtimeVoice.ts src/hooks/useRealtimeVoice.test.tsx src/components/opportunities/live/LiveParticleGlobe.tsx src/components/opportunities/live/globeRuntime.ts

      - name: Production build
        run: bun run build
