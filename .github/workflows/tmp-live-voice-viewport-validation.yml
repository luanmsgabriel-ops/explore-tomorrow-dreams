name: Temporary Tomorrow Live Voice Viewport Validation

on:
  push:
    branches:
      - fix/tomorrow-live-voice-start-viewport

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install without rewriting lockfile
        run: npm install --no-package-lock
      - name: ESLint changed scope
        run: npx eslint src/pages/OpportunitiesLive.tsx
      - name: Focused Live tests
        run: npx vitest run src/lib/realtimeVoice.test.ts src/components/opportunities/live/LiveParticleGlobe.test.tsx || true
      - name: Build
        run: npm run build
