name: Calendar type route validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Calendar tests
        run: bun run test -- src/pages/opportunitiesCalendar.test.tsx
      - name: TypeScript
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: ESLint focused scope
        run: bunx eslint src/pages/OpportunitiesCalendar.tsx src/pages/opportunitiesCalendar.test.tsx
      - name: Build
        run: bun run build
